name: Test and Create PR

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Create or update PR
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          PR_TITLE="Auto: ${BRANCH_NAME}"
          PR_BODY="Automated PR for branch ${BRANCH_NAME}"

          if gh pr list --head "${BRANCH_NAME}" --json number | grep -q number; then
            echo "Updating existing PR"
            gh pr edit --title "${PR_TITLE}" --body "${PR_BODY}"
          else
            echo "Creating new PR"
            gh pr create --title "${PR_TITLE}" --body "${PR_BODY}" --base main --draft
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
