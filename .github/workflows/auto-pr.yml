name: Auto Create Pull Request & CI

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - dev
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/auto-pr.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (for debugging build issues)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  create_pull_request:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch info
        id: branch_info
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          if [[ $BRANCH_NAME == feature/* ]]; then
            BRANCH_TYPE="feat"
            TITLE_PREFIX="✨ Feature"
          elif [[ $BRANCH_NAME == fix/* ]]; then
            BRANCH_TYPE="fix"
            TITLE_PREFIX="🐛 Fix"
          else
            BRANCH_TYPE="chore"
            TITLE_PREFIX="🔧 Update"
          fi

          echo "branch_type=$BRANCH_TYPE" >> $GITHUB_OUTPUT
          echo "title_prefix=$TITLE_PREFIX" >> $GITHUB_OUTPUT

          BRANCH_CLEAN=$(echo $BRANCH_NAME | sed 's|.*/||' | sed 's|-| |g' | sed 's|_| |g')
          echo "branch_clean=$BRANCH_CLEAN" >> $GITHUB_OUTPUT

      - name: Analyze git changes
        id: analyze_changes
        run: |
          # Get diff against main branch
          git fetch origin main:main 2>/dev/null || echo "Main branch already available"

          # Generate diff summary
          DIFF_SUMMARY=$(git diff --stat main...HEAD 2>/dev/null || git diff --stat HEAD~1...HEAD)
          DIFF_CONTENT=$(git diff main...HEAD 2>/dev/null || git diff HEAD~1...HEAD)

          # Get recent commit messages
          COMMIT_MESSAGES=$(git log --oneline main...HEAD 2>/dev/null || git log --oneline -n 5)

          # Get changed files
          CHANGED_FILES=$(git diff --name-only main...HEAD 2>/dev/null || git diff --name-only HEAD~1...HEAD)

          # Prepare data for AI analysis (truncate if too long and use safer output format)
          DIFF_SUMMARY_SAFE=$(echo "$DIFF_SUMMARY" | head -20 | tr '\n' ' ' | tr -d '"' | cut -c1-500)
          COMMIT_MESSAGES_SAFE=$(echo "$COMMIT_MESSAGES" | head -10 | tr '\n' ' ' | tr -d '"' | cut -c1-500)
          CHANGED_FILES_SAFE=$(echo "$CHANGED_FILES" | head -20 | tr '\n' ' ' | tr -d '"' | cut -c1-500)
          DIFF_CONTENT_SAFE=$(echo "$DIFF_CONTENT" | head -c 1000 | tr '\n' ' ' | tr -d '"' | cut -c1-1000)

          # Output as single line values to avoid EOF delimiter issues
          echo "diff_summary=$DIFF_SUMMARY_SAFE" >> $GITHUB_OUTPUT
          echo "commit_messages=$COMMIT_MESSAGES_SAFE" >> $GITHUB_OUTPUT
          echo "changed_files=$CHANGED_FILES_SAFE" >> $GITHUB_OUTPUT
          echo "diff_content=$DIFF_CONTENT_SAFE" >> $GITHUB_OUTPUT

      - name: Generate AI PR content
        id: ai_content
        run: |
          # Extract and sanitize variables to avoid shell metacharacter issues
          BRANCH_NAME=$(echo '${{ steps.branch_info.outputs.branch_name }}' | sed 's/[`$"\\]/\\&/g')
          BRANCH_TYPE=$(echo '${{ steps.branch_info.outputs.branch_type }}' | sed 's/[`$"\\]/\\&/g')
          CHANGED_FILES=$(echo '${{ steps.analyze_changes.outputs.changed_files }}' | sed 's/[`$"\\]/\\&/g')
          COMMIT_MESSAGES=$(echo '${{ steps.analyze_changes.outputs.commit_messages }}' | sed 's/[`$"\\]/\\&/g')
          DIFF_SUMMARY=$(echo '${{ steps.analyze_changes.outputs.diff_summary }}' | sed 's/[`$"\\]/\\&/g')
          DIFF_CONTENT=$(echo '${{ steps.analyze_changes.outputs.diff_content }}' | sed 's/[`$"\\]/\\&/g')

          # Build prompt content as a single line to avoid YAML parsing issues
          PROMPT_CONTENT="Analyze these code changes for an IntelliJ IDEA plugin called 'CPI Assistant' for SAP Cloud Platform Integration. Branch: $BRANCH_NAME. Branch type: $BRANCH_TYPE. Changed files: $CHANGED_FILES. Commit messages: $COMMIT_MESSAGES. Diff summary: $DIFF_SUMMARY. Code changes: $DIFF_CONTENT. Generate a complete PR with: 1. Concise title (without emoji prefix, max 60 chars) 2. Complete description with ALL sections including: ## Summary [Brief description of what this PR does] ## Changes [Bullet points of key changes] ## Impact [What areas of the codebase are affected] ## Type of Change [Select appropriate checkboxes based on analysis] - [ ] 🐛 Bug fix (non-breaking change which fixes an issue) - [ ] ✨ New feature (non-breaking change which adds functionality) - [ ] 💥 Breaking change (fix or feature that would cause existing functionality to not work as expected) - [ ] 📚 Documentation update - [ ] 🔧 Maintenance/refactoring ## Testing [Context-aware testing checklist based on changes] - [ ] Tests have been added/updated for new functionality - [ ] All existing tests pass - [ ] Manual testing completed for [specific areas] - [ ] CI checks are passing ✅ ## Checklist [Code review checklist with specific focus areas] - [ ] Code follows project style guidelines - [ ] Self-review of code completed - [ ] Comments added for complex logic - [ ] Documentation updated if needed - [ ] [Add specific items based on changes] --- 🤖 *This PR was auto-created with AI-generated content* Respond in this exact JSON format: { \"title\": \"your title here\", \"description\": \"your complete multi-line description here\" }"


          # Create JSON payload using jq to ensure proper escaping
          jq -n \
            --arg model "claude-3-haiku-20240307" \
            --arg content "$PROMPT_CONTENT" \
            '{
              "model": $model,
              "max_tokens": 1500,
              "messages": [
                {
                  "role": "user",
                  "content": $content
                }
              ]
            }' > prompt.json

          # Call Claude API with error handling
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "🤖 Generating AI-powered PR content..."

            RESPONSE=$(curl -s -X POST "https://api.anthropic.com/v1/messages" \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
              -H "anthropic-version: 2023-06-01" \
              -d @prompt.json \
              --max-time 30 \
              --retry 2)

            # Extract content from Claude response
            if echo "$RESPONSE" | jq -e '.content[0].text' > /dev/null 2>&1; then
              AI_JSON=$(echo "$RESPONSE" | jq -r '.content[0].text')

              # Parse AI response
              if echo "$AI_JSON" | jq -e '.title' > /dev/null 2>&1; then
                AI_TITLE=$(echo "$AI_JSON" | jq -r '.title')
                AI_DESCRIPTION=$(echo "$AI_JSON" | jq -r '.description')

                echo "ai_title=${AI_TITLE}" >> $GITHUB_OUTPUT
                # Encode AI description to avoid multiline issues
                AI_DESCRIPTION_ENCODED=$(echo "$AI_DESCRIPTION" | base64 -w 0)
                echo "ai_description_encoded=${AI_DESCRIPTION_ENCODED}" >> $GITHUB_OUTPUT
                echo "ai_success=true" >> $GITHUB_OUTPUT

                echo "✅ AI content generated successfully"
              else
                echo "⚠️ AI response parsing failed, using fallback"
                echo "ai_success=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "⚠️ AI API call failed, using fallback"
              echo "ai_success=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ ANTHROPIC_API_KEY not set, using fallback"
            echo "ai_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if PR exists
        id: check_pr
        run: |
          PR_EXISTS=$(gh pr list --head "${{ steps.branch_info.outputs.branch_name }}" --json number --jq length)
          echo "pr_exists=$PR_EXISTS" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare PR content
        id: pr_content
        run: |
          # Use AI-generated content if available, otherwise minimal fallback
          if [ "${{ steps.ai_content.outputs.ai_success }}" = "true" ]; then
            echo "✅ Using AI-generated PR content"

            FINAL_TITLE="${{ steps.branch_info.outputs.title_prefix }}: ${{ steps.ai_content.outputs.ai_title }}"
            # Decode the AI-generated description
            FINAL_DESCRIPTION=$(echo "${{ steps.ai_content.outputs.ai_description_encoded }}" | base64 -d)

          else
            echo "⚠️  AI generation failed, using minimal fallback"

            FINAL_TITLE="${{ steps.branch_info.outputs.title_prefix }}: ${{ steps.branch_info.outputs.branch_clean }}"
            FINAL_DESCRIPTION="## Summary\nAuto-generated PR for \`${{ steps.branch_info.outputs.branch_name }}\` branch.\n\n**Note:** AI-powered description generation failed. Please manually add:\n- Description of changes\n- Testing notes\n- Review checklist\n\n---\n🤖 *Auto-created from branch \`${{ steps.branch_info.outputs.branch_name }}\`*"
          fi

          # Use safer output format to avoid EOF delimiter issues
          echo "final_title=${FINAL_TITLE}" >> $GITHUB_OUTPUT

          # For description, encode newlines to avoid multiline issues
          FINAL_DESCRIPTION_ENCODED=$(echo "$FINAL_DESCRIPTION" | base64 -w 0)
          echo "final_description_encoded=${FINAL_DESCRIPTION_ENCODED}" >> $GITHUB_OUTPUT

      - name: Prepare PR labels
        if: steps.check_pr.outputs.pr_exists == '0'
        id: pr_labels
        run: |
          BASE_LABELS="${{ steps.branch_info.outputs.branch_type }},auto-created"
          if [ "${{ steps.ai_content.outputs.ai_success }}" = "true" ]; then
            FULL_LABELS="${BASE_LABELS},ai-powered"
          else
            FULL_LABELS="${BASE_LABELS}"
          fi
          echo "labels=$FULL_LABELS" >> $GITHUB_OUTPUT

      - name: Decode PR description
        if: steps.check_pr.outputs.pr_exists == '0'
        id: decode_description
        run: |
          DECODED_DESCRIPTION=$(echo "${{ steps.pr_content.outputs.final_description_encoded }}" | base64 -d)
          echo "decoded_description=${DECODED_DESCRIPTION}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_pr.outputs.pr_exists == '0'
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "main"
          pr_title: "${{ steps.pr_content.outputs.final_title }}"
          pr_body: "${{ steps.decode_description.outputs.decoded_description }}"
          pr_label: "${{ steps.pr_labels.outputs.labels }}"
          pr_draft: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add reviewers and assignees
        if: steps.check_pr.outputs.pr_exists == '0'
        run: |
          PR_NUMBER=$(gh pr list --head "${{ steps.branch_info.outputs.branch_name }}" --json number --jq '.[0].number')
          gh pr edit $PR_NUMBER --add-assignee "${{ github.actor }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Build project
        id: build
        run: |
          echo "🔨 Building project..."
          ./gradlew compileKotlin compileTestKotlin --no-daemon --stacktrace
          echo "build_status=success" >> $GITHUB_OUTPUT

      - name: Run unit tests
        if: inputs.skip_tests != 'true'
        id: test
        run: |
          echo "🧪 Running unit tests..."
          ./gradlew test --no-daemon --continue --stacktrace
          echo "test_status=success" >> $GITHUB_OUTPUT

      - name: Generate test report
        if: always() && inputs.skip_tests != 'true'
        run: |
          echo "📊 Generating test reports..."
          ./gradlew testReport --no-daemon || true

      - name: Parse test results
        if: always() && inputs.skip_tests != 'true'
        id: test_results
        run: |
          if [ -f build/test-results/test/TEST-*.xml ]; then
            # Count test results from XML files
            TOTAL_TESTS=$(grep -h 'testsuite' build/test-results/test/TEST-*.xml | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{sum += $1} END {print sum}' || echo "0")
            FAILED_TESTS=$(grep -h 'testsuite' build/test-results/test/TEST-*.xml | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{sum += $1} END {print sum}' || echo "0")
            SKIPPED_TESTS=$(grep -h 'testsuite' build/test-results/test/TEST-*.xml | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{sum += $1} END {print sum}' || echo "0")
            PASSED_TESTS=$((TOTAL_TESTS - FAILED_TESTS - SKIPPED_TESTS))

            echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
            echo "passed_tests=$PASSED_TESTS" >> $GITHUB_OUTPUT
            echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT
            echo "skipped_tests=$SKIPPED_TESTS" >> $GITHUB_OUTPUT

            if [ "$FAILED_TESTS" -gt 0 ]; then
              echo "has_failures=true" >> $GITHUB_OUTPUT
            else
              echo "has_failures=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No test results found"
            echo "total_tests=0" >> $GITHUB_OUTPUT
            echo "passed_tests=0" >> $GITHUB_OUTPUT
            echo "failed_tests=0" >> $GITHUB_OUTPUT
            echo "skipped_tests=0" >> $GITHUB_OUTPUT
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            build/reports/
            build/kotlin/
          retention-days: 3

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always() && inputs.skip_tests != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const testResults = {
              total: '${{ steps.test_results.outputs.total_tests }}',
              passed: '${{ steps.test_results.outputs.passed_tests }}',
              failed: '${{ steps.test_results.outputs.failed_tests }}',
              skipped: '${{ steps.test_results.outputs.skipped_tests }}',
              hasFailures: '${{ steps.test_results.outputs.has_failures }}' === 'true'
            };

            const buildStatus = '${{ steps.build.outcome }}';
            const testStatus = '${{ steps.test.outcome }}';

            let emoji = testResults.hasFailures || testStatus === 'failure' ? '❌' : '✅';
            let status = testResults.hasFailures || testStatus === 'failure' ? 'FAILED' : 'PASSED';

            const comment = `## ${emoji} CI Results ${status}

            ### 🔨 Build Status
            ${buildStatus === 'success' ? '✅ Build successful' : '❌ Build failed'}

            ### 🧪 Test Results
            ${testStatus === 'skipped' ? '⏭️ Tests skipped' : ''}
            ${testStatus === 'success' && !testResults.hasFailures ? `✅ All tests passed!
            - **Total Tests:** ${testResults.total}
            - **Passed:** ${testResults.passed}
            - **Failed:** ${testResults.failed}
            - **Skipped:** ${testResults.skipped}` : ''}
            ${testResults.hasFailures ? `❌ Some tests failed
            - **Total Tests:** ${testResults.total}
            - **Passed:** ${testResults.passed}
            - **Failed:** ${testResults.failed}
            - **Skipped:** ${testResults.skipped}

            📋 [View detailed test report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})` : ''}

            ### 📊 Artifacts
            - 📁 [Test Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - 🔧 [Build Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---
            🤖 *Automated CI check - Run #${{ github.run_number }}*`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('CI Results')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  # Quality gate job - fails the workflow if tests fail
  quality-gate:
    name: Quality Gate
    needs: test
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed or were cancelled"
            echo "Build status: ${{ needs.test.result }}"
            exit 1
          else
            echo "✅ All tests passed successfully"
          fi

      - name: Quality gate passed
        run: |
          echo "🎉 Quality gate passed! Ready for code review."
          echo "- Build: ✅ Success"
          echo "- Tests: ✅ All passed"
          echo "- Ready for merge: ✅ Yes"
